<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>DeFi Verification Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<div class="max-w-2xl mx-auto p-6">

  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-xl font-semibold text-gray-900">DeFi Verification Agent</h1>
      <p class="text-sm text-gray-500">Graph-based pre-execution verification</p>
    </div>
    <button id="wallet-btn" onclick="connectWallet()"
      class="px-4 py-2 text-sm border border-gray-200 rounded-lg hover:bg-gray-100">
      Connect Wallet
    </button>
  </div>

  <div id="wallet-info" class="hidden mb-4 px-4 py-2 bg-green-50 border border-green-200 rounded-lg text-sm text-green-700"></div>

  <div id="chat" class="space-y-3 mb-4 min-h-32"></div>

  <div class="flex gap-2">
    <input id="input" type="text"
      placeholder='Try: "Swap 100 USDC for WETH on Uniswap"'
      class="flex-1 px-4 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:border-gray-400"
      onkeydown="if(event.key==='Enter') send()"/>
    <button onclick="send()"
      class="px-4 py-2 text-sm bg-gray-900 text-white rounded-lg hover:bg-gray-700">
      Send
    </button>
  </div>

  <div class="mt-3 flex gap-2 flex-wrap">
    <button onclick="quick('Swap 100 USDC for WETH on Uniswap')"
      class="px-3 py-1 text-xs border border-gray-200 rounded-full hover:bg-gray-100">
      Swap USDC → WETH
    </button>
    <button onclick="quick('Supply 50 USDC to Aave')"
      class="px-3 py-1 text-xs border border-gray-200 rounded-full hover:bg-gray-100">
      Supply USDC to Aave
    </button>
    <button onclick="quick('Swap USDC using Official-Uniswap-Pool')"
      class="px-3 py-1 text-xs border border-gray-200 rounded-full hover:bg-gray-100 text-red-500">
      Adversarial prompt
    </button>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
